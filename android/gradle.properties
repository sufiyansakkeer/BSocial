org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M" -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
kotlin.incremental.useClasspathSnapshot=false

# Network timeout settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=org.gradle.configuration-cache=true
org.gradle.caching=true
# org.gradle.workers.max=8

# Network connection settings
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000

# Gradle offline mode (uncomment if you're having persistent network issues)
# org.gradle.offline=true
name: bsocial
description: A social media app built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  # Sorted Dependencies
  bloc: ^8.1.4
  blurrycontainer: ^2.1.0
  cached_network_image: ^3.3.1
  cloud_firestore: ^5.6.7
  connectivity_plus: ^5.0.2
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dot_navigation_bar: ^1.0.2
  equatable: ^2.0.7
  firebase_auth: ^5.5.3
  firebase_core: ^3.13.0
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_local_notifications: ^16.3.2
  flutter_localizations:
    sdk: flutter
  flutter_phoenix: ^1.1.1
  flutter_staggered_grid_view: ^0.7.0
  freezed_annotation: ^2.4.1
  get_it: ^8.0.3
  go_router: ^13.2.0
  google_sign_in: ^6.3.0
  google_sign_in_web_redirect: ^0.0.1
  grouped_list: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^0.13.6
  image_picker: ^1.1.2
  internet_connection_checker: ^1.0.0+1
  intl: ^0.19.0
  json_annotation: ^4.8.1
  logger: ^2.0.2+1
  overlay_support: ^2.1.0
  path_provider: ^2.1.2
  provider: ^6.1.2
  restart_app: ^1.3.2
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sticky_headers: ^0.3.0+2
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  # Sorted Development Dependencies
  bloc_test: ^9.1.6
  build_runner: ^2.4.8
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.7
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic

  # Generate localization files
  generate: true
